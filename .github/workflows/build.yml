name: build-chromium-tabscroll

# Builds Chromium with horizontal tab scrolling on FREE GitHub-hosted runners.
# No paid runners, no paid object storage, no personal access token.
#
# A cold Chromium build does not fit one free 6-hour job, so the build is
# time-boxed and its compile cache (sccache) is persisted between runs with the
# free GitHub Actions cache. A lean, symbol-free component build keeps that cache
# under the 10 GB Actions-cache cap, so successive runs advance the compile
# frontier without eviction and eventually converge on a finished binary.
#
# Continuation is automatic: a schedule wakes the build every 6 hours and it
# picks up where the last run stopped. You can also press "Run workflow" to
# advance immediately. Once the binary is built, a marker short-circuits further
# runs so the schedule stops doing real work.

on:
  workflow_dispatch:
    inputs:
      max_build_minutes:
        description: "stop the build after N minutes to leave time to save cache"
        default: "300"
  schedule:
    - cron: "0 */6 * * *"      # every 6h: auto-continue until the build finishes
  push:
    paths: [ "src/**", "integration/**", "config/**", "scripts/**", ".github/workflows/**" ]

permissions:
  contents: read
  actions: write               # to read/write the Actions cache

env:
  CACHE_VER: v1                 # bump to discard all persisted caches

jobs:
  # Fast, free signal (~1 min, no checkout): do the integrator's anchors still
  # bind to upstream HEAD? Catches drift before the long build ever starts.
  integrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/integrate-check.sh main

  build:
    needs: integrate-check
    runs-on: ubuntu-latest
    timeout-minutes: 350         # under the 360-minute hard limit
    env:
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
      SCCACHE_VERSION: v0.8.2
      SCCACHE_DIR: /mnt/work/sccache
      SCCACHE_CACHE_SIZE: 9G     # stay under the 10 GB Actions-cache cap
    steps:
      - uses: actions/checkout@v4

      # Short-circuit once a finished binary has been produced. Keeps the 6-hour
      # schedule from rebuilding forever.
      - name: Check for completed build
        id: done
        uses: actions/cache/restore@v4
        with:
          path: .build-complete
          key: complete-${{ env.CACHE_VER }}
      - name: Stop if already built
        if: steps.done.outputs.cache-hit == 'true'
        run: |
          echo "::notice::A finished binary already exists; nothing to do."
          echo "skip=1" >> "$GITHUB_ENV"

      - name: Reclaim disk and prepare work volume
        if: env.skip != '1'
        run: |
          sudo bash scripts/reclaim-disk.sh
          # /mnt is the large ephemeral disk (~65 GB); build there.
          sudo mkdir -p /mnt/work && sudo chown "$USER:$USER" /mnt/work
          mkdir -p "$SCCACHE_DIR"

      - name: Restore compile cache (free Actions cache)
        if: env.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: /mnt/work/sccache
          key: sccache-${{ env.CACHE_VER }}-${{ github.run_id }}
          restore-keys: sccache-${{ env.CACHE_VER }}-

      - name: Install sccache
        if: env.skip != '1'
        run: |
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin
          sccache --version

      - name: Fetch depot_tools
        if: env.skip != '1'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          echo "$DEPOT_TOOLS" >> "$GITHUB_PATH"

      - name: Fetch Chromium (no history)
        if: env.skip != '1'
        run: |
          cd /mnt/work
          mkdir -p chromium && cd chromium
          fetch --no-history --nohooks chromium
          echo "src=/mnt/work/chromium/src" >> "$GITHUB_ENV"

      - name: Install build deps
        if: env.skip != '1'
        working-directory: ${{ env.src }}
        run: sudo ./build/install-build-deps.sh --no-prompt

      - name: Sync hooks
        if: env.skip != '1'
        working-directory: ${{ env.src }}
        run: gclient runhooks

      - name: Apply tab-scrolling rewrite
        if: env.skip != '1'
        working-directory: ${{ env.src }}
        run: CHROMIUM_SRC="$PWD" bash "$GITHUB_WORKSPACE/scripts/apply-patches.sh"

      - name: Configure build (lean, cache-friendly)
        if: env.skip != '1'
        working-directory: ${{ env.src }}
        run: |
          mkdir -p out/Default
          cp "$GITHUB_WORKSPACE/config/args.gn" out/Default/args.gn
          gn gen out/Default

      - name: Build (time-boxed)
        if: env.skip != '1'
        working-directory: ${{ env.src }}
        run: |
          sccache --start-server || true
          MINS="${{ github.event.inputs.max_build_minutes || 300 }}"
          set +e
          timeout "${MINS}m" autoninja -C out/Default chrome
          status=$?
          set -e
          sccache --show-stats || true
          echo "build_status=$status" >> "$GITHUB_ENV"
          if [ $status -eq 124 ]; then
            echo "::notice::Time box hit. Cache saved; the schedule will continue."
          fi

      # Always persist the warmed cache, even when the build timed out, so the
      # next run resumes. Unique key per run; restore-keys grabs the newest.
      - name: Save compile cache
        if: always() && env.skip != '1'
        uses: actions/cache/save@v4
        with:
          path: /mnt/work/sccache
          key: sccache-${{ env.CACHE_VER }}-${{ github.run_id }}

      - name: Package Chrome (if the build finished)
        if: env.build_status == '0'
        working-directory: ${{ env.src }}
        run: |
          cd out/Default
          tar -czf "$GITHUB_WORKSPACE/chrome-tabscroll-linux.tar.gz" \
            chrome chrome_100_percent.pak chrome_200_percent.pak resources.pak \
            icudtl.dat v8_context_snapshot.bin *.so 2>/dev/null || \
          tar -czf "$GITHUB_WORKSPACE/chrome-tabscroll-linux.tar.gz" chrome *.pak *.bin *.dat *.so
          echo built > "$GITHUB_WORKSPACE/.build-complete"

      - name: Upload Chrome binary
        if: env.build_status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-tabscroll-linux
          path: chrome-tabscroll-linux.tar.gz
          retention-days: 14

      - name: Mark build complete
        if: env.build_status == '0'
        uses: actions/cache/save@v4
        with:
          path: .build-complete
          key: complete-${{ env.CACHE_VER }}
